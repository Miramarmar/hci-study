<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Session</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1a2e;--muted:#6b7a8d;--border:#dde3ed;--bg:#f4f6fa;--white:#fff;--accent:#3d5a80;--radius:14px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  /* WELCOME */
  #welcomeScreen{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(145deg,#0f1b2d,#1a3a5c);}
  .card{background:var(--white);border-radius:22px;padding:3rem 2.5rem;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center;animation:rise .5s cubic-bezier(.16,1,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .emblem{font-size:3rem;display:block;margin-bottom:1.25rem;}
  h1{font-family:'DM Serif Display',serif;font-size:1.75rem;margin-bottom:.5rem;line-height:1.2;}
  .subtitle{color:var(--muted);font-size:.9rem;margin-bottom:2rem;}
  .spin-wrap{display:flex;align-items:center;justify-content:center;gap:.75rem;color:var(--muted);font-size:.9rem;margin-bottom:1.75rem;}
  .mini-spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .id-badge{background:var(--bg);border:2px dashed var(--border);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.75rem;display:none;}
  .id-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:.4rem;}
  .id-value{font-size:2rem;font-weight:700;letter-spacing:.15em;font-family:'DM Serif Display',serif;}
  .id-hint{font-size:.78rem;color:var(--muted);margin-top:.5rem;}
  .btn-start{width:100%;padding:1rem;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s,transform .15s;display:none;}
  .btn-start:hover{background:#2a2a45;transform:translateY(-1px);}
  .btn-start:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .err{margin-top:.75rem;font-size:.85rem;color:#c0392b;min-height:1.2em;}

  /* CHAT */
  #chatScreen{flex:1;display:none;flex-direction:column;height:100dvh;}
  .chat-hdr{background:#fff;border-bottom:1px solid var(--border);padding:.9rem 1.4rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 12px rgba(0,0,0,.06);flex-shrink:0;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
  .hdr-info{flex:1;min-width:0;}
  .hdr-info h2{font-size:1rem;font-weight:600;}
  .hdr-meta{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;margin-top:.15rem;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:#27ae60;}
  .id-chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:.18rem .65rem;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;}
  .btn-end{padding:.45rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:transparent;font-size:.8rem;font-family:'DM Sans',sans-serif;color:var(--muted);cursor:pointer;transition:all .2s;flex-shrink:0;}
  .btn-end:hover{border-color:#c0392b;color:#c0392b;background:#fff5f5;}
  .messages{flex:1;overflow-y:auto;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1rem;scroll-behavior:smooth;}
  .msg{display:flex;gap:.7rem;animation:msgIn .3s cubic-bezier(.16,1,.3,1) both;max-width:80%;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg.assistant{align-self:flex-start;}
  .msg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:var(--bg);border:1.5px solid var(--border);margin-top:.15rem;}
  .msg.assistant .msg-av{background:var(--accent);border-color:transparent;}
  .bubble{padding:.75rem 1.1rem;border-radius:var(--radius);line-height:1.55;font-size:.93rem;}
  .msg.user .bubble{background:var(--ink);color:#fff;border-bottom-right-radius:4px;}
  .msg.assistant .bubble{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .ts{font-size:.7rem;color:var(--muted);margin-top:.3rem;}
  .msg.user .ts{text-align:right;}
  .dots{display:flex;gap:5px;padding:.4rem 0;align-items:center;}
  .dots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite;}
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .input-bar{background:#fff;border-top:1px solid var(--border);padding:.9rem 1.1rem;display:flex;gap:.75rem;align-items:flex-end;flex-shrink:0;}
  #msgInput{flex:1;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:12px;font-size:.93rem;font-family:'DM Sans',sans-serif;resize:none;max-height:120px;line-height:1.45;transition:border-color .2s,box-shadow .2s;color:var(--ink);}
  #msgInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(61,90,128,.1);}
  .btn-send{width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .2s,transform .15s;flex-shrink:0;}
  .btn-send:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  #overlay{display:none;position:fixed;inset:0;background:rgba(15,27,45,.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:999;}
  .big-spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @media(max-width:500px){.card{padding:2rem 1.5rem;}.msg{max-width:92%;}}
</style>
</head>
<body>

<div id="welcomeScreen">
  <div class="card">
    <span class="emblem">🎓</span>
    <h1>AI Learning Session</h1>
    <p class="subtitle">Welcome! We are preparing your session…</p>
    <div class="spin-wrap" id="genSpinner">
      <div class="mini-spin"></div>
      <span>Generating your student ID…</span>
    </div>
    <div class="id-badge" id="idBadge">
      <div class="id-label">Your Student ID</div>
      <div class="id-value" id="idDisplay">—</div>
      <div class="id-hint">📝 Note this down — your researcher may ask for it</div>
    </div>
    <button class="btn-start" id="startBtn">Start Learning Session →</button>
    <p class="err" id="errMsg"></p>
  </div>
</div>

<div id="chatScreen">
  <div class="chat-hdr">
    <div class="avatar" id="hdrAvatar">🤖</div>
    <div class="hdr-info">
      <h2 id="hdrName">Learning Assistant</h2>
      <div class="hdr-meta">
        <span class="dot"></span>
        <span>Online</span>
        <span class="id-chip" id="hdrId"></span>
      </div>
    </div>
    <button class="btn-end" id="endBtn">End Session</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-bar">
    <textarea id="msgInput" rows="1" placeholder="Ask a question…"></textarea>
    <button class="btn-send" id="sendBtn">➤</button>
  </div>
</div>

<div id="overlay"><div class="big-spin"></div></div>

<script type="module">
// ── PASTE YOUR KEYS HERE ──────────────────────
const SUPABASE_URL   = 'https://xvaokacldkgofkoldpdu.supabase.co';
const SUPABASE_ANON  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2YW9rYWNsZGtnb2Zrb2xkcGR1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MTMyNTc2NCwiZXhwIjoyMDg2OTAxNzY0fQ.OqaGtCYUbSO_WqBWpGjjLT46BsakX9r-AhSFpPpnSLk';
const GEMINI_API_KEY = 'AIzaSyDineipjWdeXV77Z7N5w7qLiNnbs7zwhr4';
const STUDY_PREFIX   = 'HCI2026';   // 
// ─────────────────────────────────────────────

const PERSONAS = {
  control:{name:'Research Assistant',icon:'📊',color:'#3d5a80',temp:0.2,
    system:`You are a neutral, strictly factual educational assistant.
- Only objective, verified information. Formal academic language.
- No exclamation marks or emotional language. No praise or encouragement.
- Concise. Stay on topic only.`},
  test:{name:'Learning Coach',icon:'🌟',color:'#2d8653',temp:0.75,
    system:`You are a warm, enthusiastic, emotionally supportive learning coach.
- Be genuinely excited to help. Start with positive acknowledgement ("Great question!").
- Encouraging, motivating language. Celebrate curiosity and effort.
- Make ideas feel approachable and exciting.
- End with an invitation to explore further ("What else would you like to discover?").
- Be persuasive: make the student feel learning is meaningful and rewarding.`}
};

const hdrs={apikey:SUPABASE_ANON,Authorization:`Bearer ${SUPABASE_ANON}`,'Content-Type':'application/json',Prefer:'return=representation'};
const sb={
  async get(t,q=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${q}`,{headers:hdrs});if(!r.ok)throw new Error(await r.text());return r.json();},
  async insert(t,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:hdrs,body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();},
  async update(t,q,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${q}`,{method:'PATCH',headers:hdrs,body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());}
};

function makeId(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];
  return `${STUDY_PREFIX}-${s}`;
}

let student=null,convId=null,history=[],persona=null;
const $=id=>document.getElementById(id);

// ── STEP 1: Auto-generate ID on page load ─────
async function init(){
  try{
    let sid,attempts=0;
    while(attempts<5){
      sid=makeId();
      const ex=await sb.get('students',`student_id=eq.${sid}&select=student_id`);
      if(!ex.length)break;
      attempts++;
    }
    const group=Math.random()<0.5?'control':'test';
    const [row]=await sb.insert('students',{student_id:sid,study_group:group,has_started:false});
    student=row; persona=PERSONAS[group];
    $('genSpinner').style.display='none';
    $('idDisplay').textContent=sid;
    $('idBadge').style.display='block';
    $('startBtn').style.display='block';
  }catch(e){
    console.error(e);
    $('genSpinner').style.display='none';
    $('errMsg').textContent='Could not connect. Please refresh the page.';
  }
}
init();

// ── STEP 2: Student clicks Start ──────────────
$('startBtn').addEventListener('click',async()=>{
  $('startBtn').disabled=true;
  $('overlay').style.display='flex';
  try{
    const [conv]=await sb.insert('conversations',{student_id:student.student_id,study_group:student.study_group,messages:[],active:true});
    convId=conv.id;
    await sb.update('students',`student_id=eq.${student.student_id}`,{has_started:true,last_active:new Date().toISOString()});
    $('overlay').style.display='none';
    launchChat();
  }catch(e){
    $('overlay').style.display='none';
    $('errMsg').textContent='Connection error. Please refresh the page.';
    $('startBtn').disabled=false;
  }
});

// ── STEP 3: Chat UI ───────────────────────────
function launchChat(){
  document.documentElement.style.setProperty('--accent',persona.color);
  $('hdrAvatar').textContent=persona.icon;
  $('hdrName').textContent=persona.name;
  $('hdrId').textContent=`ID: ${student.student_id}`;
  $('welcomeScreen').style.display='none';
  $('chatScreen').style.display='flex';
  const w=student.study_group==='test'
    ?`Hello! I'm so excited to be your learning companion today! 🌟 Ask me anything about the topic — what would you like to discover first?`
    :`Hello. I am your educational assistant for this session. Please enter your question about the study topic.`;
  addBubble('assistant',w);
  $('msgInput').focus();
}

$('sendBtn').addEventListener('click',send);
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('msgInput').addEventListener('input',()=>{$('msgInput').style.height='auto';$('msgInput').style.height=Math.min($('msgInput').scrollHeight,120)+'px';});

async function send(){
  const text=$('msgInput').value.trim();
  if(!text||$('sendBtn').disabled)return;
  $('msgInput').value='';$('msgInput').style.height='auto';$('sendBtn').disabled=true;
  addBubble('user',text);
  history.push({role:'user',content:text,ts:new Date().toISOString()});
  const typing=showTyping();
  try{
    const reply=await callGemini(text);
    typing.remove();addBubble('assistant',reply);
    history.push({role:'assistant',content:reply,ts:new Date().toISOString()});
    await save();
  }catch(e){typing.remove();addBubble('assistant','Something went wrong. Please try again.');console.error(e);}
  $('sendBtn').disabled=false;$('msgInput').focus();
}

async function callGemini(msg){
  const ctx=history.slice(-16).map(m=>`${m.role==='user'?'Student':'Assistant'}: ${m.content}`).join('\n');
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
    {method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:`${persona.system}\n\n--- Conversation ---\n${ctx}\n---\n\nStudent: ${msg}\n\nRespond now:`}]}],
    generationConfig:{temperature:persona.temp,maxOutputTokens:600}})});
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message);}
  const d=await res.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'Please try again.';
}

async function save(){
  if(!convId)return;
  try{await sb.update('conversations',`id=eq.${convId}`,{messages:history,message_count:history.length,last_updated:new Date().toISOString()});}
  catch(e){console.warn(e);}
}

$('endBtn').addEventListener('click',async()=>{
  if(!confirm('End your session? Make sure you have finished studying.'))return;
  await sb.update('conversations',`id=eq.${convId}`,{active:false,ended_at:new Date().toISOString(),messages:history,message_count:history.length});
  document.body.innerHTML=`<div style="height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background:#f4f6fa;text-align:center;padding:2rem;"><div><div style="font-size:3rem;margin-bottom:1rem;">✅</div><h2 style="font-size:1.6rem;margin-bottom:.75rem;">Session Complete</h2><p style="color:#6b7a8d;">Your conversation has been saved.</p><p style="color:#6b7a8d;margin-top:.4rem;">Please proceed to the paper post-test.</p></div></div>`;
});

function addBubble(role,text){
  const wrap=document.createElement('div');wrap.className=`msg ${role}`;
  const av=document.createElement('div');av.className='msg-av';av.textContent=role==='user'?'👤':persona.icon;
  const body=document.createElement('div');
  const bub=document.createElement('div');bub.className='bubble';bub.textContent=text;
  const ts=document.createElement('div');ts.className='ts';ts.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  body.appendChild(bub);body.appendChild(ts);wrap.appendChild(av);wrap.appendChild(body);
  $('messages').appendChild(wrap);$('messages').scrollTop=$('messages').scrollHeight;
  return wrap;
}

function showTyping(){
  const wrap=document.createElement('div');wrap.className='msg assistant';
  wrap.innerHTML=`<div class="msg-av">${persona?.icon||'🤖'}</div><div><div class="bubble" style="padding:.6rem 1rem;"><div class="dots"><span></span><span></span><span></span></div></div></div>`;
  $('messages').appendChild(wrap);$('messages').scrollTop=$('messages').scrollHeight;
  return wrap;
}

setInterval(()=>{if(convId&&history.length)save();},30000);
</script>
</body>
</html>
